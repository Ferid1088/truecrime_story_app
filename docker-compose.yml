# Whole stack:  cp .env.example .env  (set TRUECRIME_ACCESS_TOKEN and TRUECRIME_POSTGRES_PASSWORD)  then  docker compose up -d --build
# Everything is published on 127.0.0.1 only; put a TLS reverse proxy in front to reach it from elsewhere.
name: truecrime

x-app-env: &app-env
  TRUECRIME_DATABASE_URL: postgresql+psycopg://truecrime:${TRUECRIME_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}}@postgres:5432/truecrime
  TRUECRIME_ACCESS_TOKEN: ${TRUECRIME_ACCESS_TOKEN:-${ACCESS_TOKEN:?set ACCESS_TOKEN in .env}}
  TRUECRIME_JOB_RUNNER: external
  TRUECRIME_LOG_FORMAT: json
  TRUECRIME_CORS_ORIGINS: ${TRUECRIME_CORS_ORIGINS:-${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}}
  TRUECRIME_COOKIE_SECURE: ${TRUECRIME_COOKIE_SECURE:-${COOKIE_SECURE:-false}}
  TRUECRIME_SEARXNG_URL: http://searxng:8080

x-app-service: &app-service
  build:
    context: .
    args:
      REQUIREMENTS: ${TRUECRIME_PY_REQUIREMENTS:-${PY_REQUIREMENTS:-requirements-documentary.txt}}
  image: truecrime-api:local
  env_file:
    - path: .env
      required: false
  environment: *app-env
  volumes:
    - tc_data:/app/data
    # Where the in-app backup button writes. Create it first and let the app user write to it:
    #   mkdir -p backups && sudo chown 10001 backups      (or point BACKUP_DIR at an external drive)
    - ${TRUECRIME_BACKUP_DIR:-${BACKUP_DIR:-./backups}}:/backups
  restart: unless-stopped
  # Not read-only: the app writes models caches under its home and the dynamic-EQ setting into config/.
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: truecrime
      POSTGRES_PASSWORD: ${TRUECRIME_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}}
      POSTGRES_DB: truecrime
    volumes:
      - tc_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truecrime -d truecrime"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    # no published port: only the other containers reach the database

  api:
    <<: *app-service
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started

  # Runs the documentary jobs. Starts after the API is healthy because the API applies database migrations.
  worker:
    <<: *app-service
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/tc-worker-alive') < 60 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${TRUECRIME_PUBLIC_API_URL:-${PUBLIC_API_URL:-http://127.0.0.1:8000}}
    image: truecrime-web:local
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /web/.next/cache
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  searxng:
    image: searxng/searxng:latest
    container_name: truecrime-searxng
    ports:
      - "127.0.0.1:8085:8080"
    volumes:
      - ./docker/searxng:/etc/searxng:rw
    environment:
      - BASE_URL=http://localhost:8085/
      - INSTANCE_NAME=truecrime-searxng
      - SEARXNG_SECRET=${TRUECRIME_SEARXNG_SECRET:-${SEARXNG_SECRET:-}}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    restart: unless-stopped

volumes:
  tc_data:
  tc_pg:
