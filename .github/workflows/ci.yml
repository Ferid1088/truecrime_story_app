name: CI

# The same checks as scripts/gate.sh, run on every push to main and every pull request.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # Mondays: new advisories show up even without a push

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRUECRIME_DATABASE_URL: sqlite:///ci-fast.db
      TRUECRIME_TEST_ADMIN_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: System packages (ffmpeg with libass for the audio, video and caption tests; fonts with Persian and Arabic glyphs)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-noto-core fonts-vazirmatn
      - name: Python dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install "Pillow>=10.3" "opencv-python-headless>=4.9" "faster-whisper>=1.1,<2" "whisper-normalizer>=0.1.12"
          # runs the phoneme-listener compatibility test against the real libraries
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=5.5,<6" "setuptools>=83"
      - name: Secret scan (tracked files)
        run: python scripts/secret_scan.py
      - name: Migrations match ORM models
        run: python scripts/check_model_migrations.py
      - name: Ruff
        run: python scripts/quality_ratchet.py ruff
      - name: Mypy
        run: python scripts/quality_ratchet.py mypy
      - name: Vulture (report only)
        run: python -m vulture app scripts --min-confidence 80 || true
      - name: Python tests
        run: python -m pytest -q -p no:cacheprovider

  backend-postgres:
    # The same Python tests against a real Postgres: it enforces foreign keys and column lengths that SQLite ignores.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: truecrime_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TRUECRIME_DATABASE_URL: postgresql+psycopg://truecrime:postgres@localhost:5432/truecrime_test
      TC_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/truecrime_test
      TRUECRIME_TEST_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: System packages (ffmpeg with libass for the audio, video and caption tests; fonts with Persian and Arabic glyphs)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-noto-core fonts-vazirmatn
      - name: Python dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install "Pillow>=10.3" "opencv-python-headless>=4.9" "faster-whisper>=1.1,<2" "whisper-normalizer>=0.1.12"
          # runs the phoneme-listener compatibility test against the real libraries
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=5.5,<6" "setuptools>=83"
      - name: Python tests on Postgres
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx next build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/app.spec.ts --reporter=list
      - name: Keep Playwright traces from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7

  audit:
    # Known-vulnerability check of what ships: Python packages and production npm packages.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python packages
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-documentary.txt pip-audit
          # torch's CPU build ("+cpu") is not on PyPI, so pip-audit cannot look it up; everything else is audited
          pip freeze --exclude torch > frozen.txt
          pip-audit -r frozen.txt --no-deps --disable-pip
      - name: Production npm packages
        working-directory: frontend
        run: |
          npm ci --omit=dev
          npm audit --omit=dev --audit-level=low
