name: CI

# The same checks as scripts/gate.sh, run on every push to main and every pull request.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # Mondays: new advisories show up even without a push

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: System packages (ffmpeg for the audio and video tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Python dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install "Pillow>=10.3" "opencv-python-headless>=4.9" "faster-whisper>=1.1,<2" "whisper-normalizer>=0.1.12"
          # runs the phoneme-listener compatibility test against the real libraries
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=5.5,<6" "setuptools>=83"
      - name: Secret scan (tracked files)
        run: python scripts/secret_scan.py
      - name: Python tests
        run: python -m pytest -q -p no:cacheprovider

  backend-postgres:
    # The same Python tests against a real Postgres: it enforces foreign keys and column lengths that SQLite ignores.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: truecrime_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TC_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/truecrime_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: System packages (ffmpeg for the audio and video tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Python dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install "Pillow>=10.3" "opencv-python-headless>=4.9" "faster-whisper>=1.1,<2" "whisper-normalizer>=0.1.12"
          # runs the phoneme-listener compatibility test against the real libraries
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=5.5,<6" "setuptools>=83"
      - name: Python tests on Postgres
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx next build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/app.spec.ts --reporter=list
      - name: Keep Playwright traces from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7

  docker:
    # Builds both images, starts the whole stack (Postgres, API, worker, web) and runs the smoke checks against it.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Settings for the stack
        run: |
          printf 'ACCESS_TOKEN=ci-token-0123456789abcdef\nPOSTGRES_PASSWORD=ci-pg-pass\nPY_REQUIREMENTS=requirements.txt\n' > .env
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 900
      - name: Smoke checks
        run: |
          pip install httpx
          python scripts/smoke.py http://127.0.0.1:8000 ci-token-0123456789abcdef
          curl -fsS http://127.0.0.1:3000/login > /dev/null
      - name: Logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop
        if: always()
        run: docker compose down -v

  audit:
    # Known-vulnerability check of what ships: Python packages and production npm packages.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python packages
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-documentary.txt pip-audit
          # torch's CPU build ("+cpu") is not on PyPI, so pip-audit cannot look it up; everything else is audited
          pip freeze --exclude torch > frozen.txt
          pip-audit -r frozen.txt --no-deps --disable-pip
      - name: Production npm packages
        working-directory: frontend
        run: |
          npm ci --omit=dev
          npm audit --omit=dev --audit-level=low
